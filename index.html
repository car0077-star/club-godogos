<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#C51717">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Club Godogos</title>
<style>
  :root{ --rojo:#C51717; --amarillo:#FFCE00; --tinta:#221E1A; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;width:100%;overflow:hidden;background:var(--tinta);
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  }
  /* Google inyecta un aviso arriba de las apps de Apps Script publicadas
     con acceso anónimo. No se puede quitar; se recorta desplazando el
     iframe hacia arriba dentro de un contenedor con overflow oculto.
     Si algún día cambia la altura del aviso, ajusta --aviso. */
  :root{ --aviso:42px }
  #ventana{
    position:fixed;inset:0;height:100dvh;overflow:hidden;background:var(--rojo);
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  #app{
    position:absolute;left:0;width:100%;border:0;display:block;
    top:calc(var(--aviso) * -1);
    height:calc(100% + var(--aviso));
    background:var(--rojo);
  }

  /* ---------- pantalla de arranque ----------
     Fondo en el rojo de la marca y el logo en amarillo, sin recuadro.
     El indicador de carga es una línea de mostaza que se dibuja sola:
     SVG y CSS, sin GIF y sin pedir un archivo extra. */
  #splash{
    position:fixed;inset:0;height:100dvh;background:var(--rojo);z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;font-family:system-ui,-apple-system,sans-serif;
    transition:opacity .4s ease;
  }
  #splash.fuera{opacity:0;pointer-events:none}

  .logo{width:clamp(96px,26vw,138px);height:auto;display:block;
        filter:drop-shadow(0 10px 22px rgba(0,0,0,.22));
        animation:entra .62s cubic-bezier(.22,1.2,.36,1) both}
  .logo path{fill:var(--amarillo)}
  @keyframes entra{
    from{opacity:0;transform:scale(.82) translateY(10px)}
    to{opacity:1;transform:none}
  }

  .rotulo{
    color:var(--amarillo);font-size:clamp(11px,3vw,13px);letter-spacing:.3em;
    text-transform:uppercase;font-weight:700;margin:0;text-align:center;
    animation:asoma .5s ease .28s both;
  }
  .rotulo span{display:block;font-size:9.5px;letter-spacing:.22em;font-weight:600;
               color:rgba(255,206,0,.55);margin-top:7px}
  @keyframes asoma{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* la mostaza que se dibuja: indicador de carga */
  .mostaza{width:150px;height:26px;overflow:visible;
           animation:asoma .5s ease .4s both}
  .mostaza path{
    fill:none;stroke:var(--amarillo);stroke-width:5;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:210;stroke-dashoffset:210;
    animation:embadurna 1.7s ease-in-out infinite;
  }
  @keyframes embadurna{
    0%{stroke-dashoffset:210;opacity:.35}
    45%{stroke-dashoffset:0;opacity:1}
    55%{stroke-dashoffset:0;opacity:1}
    100%{stroke-dashoffset:-210;opacity:.35}
  }

  @media (prefers-reduced-motion:reduce){
    .logo,.rotulo,.mostaza{animation:none}
    .mostaza path{animation:none;stroke-dashoffset:0;opacity:.9}
  }

  /* aviso de sin conexión */
  #caido{
    position:fixed;inset:0;background:var(--tinta);color:#fff;z-index:20;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;
    text-align:center;font-family:system-ui,-apple-system,sans-serif;
  }
  #caido.ver{display:flex}
  #caido h1{color:var(--amarillo);font-size:24px;letter-spacing:.02em}
  #caido p{font-size:15px;line-height:1.5;color:#B8B1A7;max-width:320px}
  #caido button{
    margin-top:6px;padding:14px 26px;border:0;border-radius:10px;background:var(--rojo);
    color:var(--tinta);font-size:16px;font-weight:700;cursor:pointer;
  }

  /* recarga discreta: sin barra de direcciones hace falta una salida */
  #recargar{
    position:fixed;z-index:15;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(10px + env(safe-area-inset-bottom));
    width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(34,30,26,.30);color:#fff;font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  #recargar:active{background:rgba(34,30,26,.65)}
</style>
</head>

<div id="caido">
  <h1>Sin conexión</h1>
  <p>La pantalla del club necesita internet para registrar visitas.
     Revisa el wifi de la terminal y vuelve a intentar.</p>
  <p style="font-size:13px;color:#8B857C">Mientras tanto, anota el WhatsApp en papel
     y regístralo cuando vuelva la señal. No pierdas al cliente.</p>
  <button onclick="reintentar()">Volver a intentar</button>
</div>

<div id="ventana">
  <iframe id="app" title="Club Godogos" allow="clipboard-write"></iframe>
</div>

<button id="recargar" onclick="recargar()" aria-label="Recargar la pantalla">&#10227;</button>

<script>
  /* =====================================================================
     ÚNICA LÍNEA QUE DEBES CAMBIAR
     Pega aquí la URL /exec de tu aplicación web de Apps Script.
     Para la pantalla del cliente, usa la misma URL con ?v=cliente
     ===================================================================== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz9m-aKFP9ZeAFVCASa7yf2hnqmSKe5Nve4Eq7taGMVPS-tPRJg0tOfg-dPNk1z-Qef/exec';
  /* ===================================================================== */

  var marco = document.getElementById('app');
  var splash = document.getElementById('splash');
  var caido = document.getElementById('caido');
  var cargado = false;

  function abrir(){
    cargado = false;
    caido.classList.remove('ver');
    marco.src = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    // si en 15 segundos no cargó, algo pasa con la red
    setTimeout(function(){ if(!cargado) caido.classList.add('ver'); }, 15000);
  }

  marco.addEventListener('load', function(){
    cargado = true;
    splash.classList.add('fuera');
    caido.classList.remove('ver');
  });

  function recargar(){ splash.classList.remove('fuera'); abrir(); }
  function reintentar(){ recargar(); }

  window.addEventListener('online', function(){ if(!cargado) recargar(); });
  window.addEventListener('offline', function(){ caido.classList.add('ver'); });

  if(!navigator.onLine){ caido.classList.add('ver'); } else { abrir(); }

  // evitar zoom por doble toque en la terminal
  var ultimoToque = 0;
  document.addEventListener('touchend', function(e){
    var ahora = Date.now();
    if(ahora - ultimoToque < 300) e.preventDefault();
    ultimoToque = ahora;
  }, { passive:false });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
